name: FamilyScreen Backend CI

on:
  push:
    branches: [ main, master, 'fix/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Backend Pytest Suite & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: familyscreen
          POSTGRES_PASSWORD: testpassword123
          POSTGRES_DB: familyscreen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Integration & Security Tests
        env:
          PYTHONPATH: backend
          FAMILYSCREEN_SECRET_KEY: test-secret-key-for-ci-minimum-32-chars-long
          TEST_POSTGRES_URL: postgresql+psycopg2://familyscreen:testpassword123@localhost:5432/familyscreen_test
        run: |
          pytest -v backend/tests/
