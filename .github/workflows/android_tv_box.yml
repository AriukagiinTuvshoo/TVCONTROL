name: FamilyScreen Android TV Box CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android TV Box APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          cd android_tv_box
          chmod +x gradlew

      - name: Run Android TV Unit Tests
        run: |
          cd android_tv_box
          ./gradlew testReleaseUnitTest --info --stacktrace

      - name: Build Android TV Debug & Release APKs
        run: |
          cd android_tv_box
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android TV APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyScreen-AndroidTV-APK
          path: android_tv_box/app/build/outputs/apk/**/*.apk
