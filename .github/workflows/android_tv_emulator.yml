name: FamilyScreen Android TV Emulator Test

on:
  workflow_dispatch:
  push:
    branches: [ 'test/phase10.1**' ]

jobs:
  emulator:
    name: Android TV 1080p Emulator Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable KVM Hardware Virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Android TV Debug APK
        run: |
          cd android_tv_box
          ./gradlew assembleDebug --stacktrace

      - name: Run Android TV Emulator Integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            echo "=== Emulator Booted Successfully ==="
            adb wait-for-device
            adb shell getprop ro.build.version.release
            adb shell getprop ro.product.model
            echo "=== Installing FamilyScreen TV Debug APK ==="
            adb install -r android_tv_box/app/build/outputs/apk/debug/app-debug.apk
            echo "=== Granting TV Permissions ==="
            adb shell pm grant mn.familyscreen.tv android.permission.PACKAGE_USAGE_STATS || true
            adb shell appops set mn.familyscreen.tv GET_USAGE_STATS allow || true
            adb shell appops set mn.familyscreen.tv SYSTEM_ALERT_WINDOW allow || true
            echo "=== Launching FamilyScreen TV Launcher Activity ==="
            adb shell am start -n mn.familyscreen.tv/.ui.FamilyScreenLauncherActivity --es EXTRA_BACKEND_URL "http://10.0.2.2:8000"
            sleep 3
            echo "=== Verifying Window Focus and Foreground Component ==="
            adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp"
            echo "=== Sending D-Pad Center Key ==="
            adb shell input keyevent 23
            echo "=== Sending D-Pad Right Key ==="
            adb shell input keyevent 22
            echo "=== Emulator Integration Test Finished ==="
